[package]
name = "tickvault"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.2.0", default-features = false, features = ["prettyprint"] }
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.5.1"
futures-util = "0.3.34"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap", "zstd", "base64"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rand = "0.10.2"
tempfile = "3.27.0"
