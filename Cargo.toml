[workspace]
# The bindings are a separate crate so the core stays a plain library: a
# `cdylib` in the main package would drag a Python ABI into every build of the
# recorder.
members = ["bindings", "sim"]

[package]
name = "tickvault"
version = "0.1.1"
edition = "2024"
description = "Full-depth crypto order book recorder and archive that publishes its own gap statistics"
# Dual, matching LICENSE-MIT and LICENSE-APACHE and the published wheel's
# metadata. The Rust convention, and changing it here would contradict both.
license = "MIT OR Apache-2.0"
repository = "https://github.com/lgoyal6/tickvault"
homepage = "https://lgoyal6.github.io/tickvault/"
documentation = "https://docs.rs/tickvault"
readme = "README.md"
keywords = ["orderbook", "crypto", "market-data", "parquet", "arrow"]
categories = ["data-structures", "science", "command-line-utilities"]
# The demo page's dataset and its compiled wasm are 5.6 MB of the repository and
# are of no use to anyone depending on this crate.
exclude = [
    # The demo page and everything it needs. Shipping the HTML without the wasm
    # and the dataset would be shipping a page that cannot load.
    "docs/data/**",
    "docs/pkg/**",
    "docs/index.html",
    "docs/app.js",
    "docs/style.css",
    "docs/.nojekyll",
    "viewer/**",
    ".github/**",
    "scripts/**",
    # The downstream Kafka/Spark package. It consumes an archive and the
    # recorder does not know it exists, so it has no business in the crate
    # someone installs to record or read one.
    "streaming/**",
    # The research harness, for the same reason: it is a consumer of an
    # archive, built on the published Python bindings, and nothing in the
    # library imports it.
    "research/**",
    # The strategy simulator, for the same reason again: it depends on this
    # crate to read an archive, and this crate does not depend on it.
    "sim/**",
    # The evaluator's committed output. Evidence for a result, of no use to
    # anyone depending on the recorder.
    "results/**",
]

[features]
default = ["record"]

# Everything needed to capture a live venue and write an archive.
#
# Reading one needs none of it, and the read-only build is what compiles to
# wasm for the viewer. Capture drags in tokio, a TLS stack, and a zstd that
# ships hand-written amd64 assembly, none of which belong in a browser.
record = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:clap",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tracing-subscriber",
    "dep:toml",
    "dep:axum",
    "arrow/prettyprint",
    "parquet/zstd",
]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
axum = { version = "0.8.7", default-features = false, features = ["http1", "tokio"], optional = true }
arrow = { version = "59.2.0", default-features = false }
async-trait = { version = "0.1.92", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
crc32fast = "1.5.1"
futures-util = { version = "0.3.34", optional = true }
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap", "base64"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = { version = "0.9.9", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"], optional = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[[bin]]
name = "tickvault"
required-features = ["record"]

[dev-dependencies]
rand = "0.10.2"
tempfile = "3.27.0"
# test-util for paused time: the idle-feed gate waits out minutes of silence,
# and doing that in real seconds would be a ten minute test.
tokio = { version = "1.53.1", features = ["test-util"] }
