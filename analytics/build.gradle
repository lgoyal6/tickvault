plugins {
    id 'scala'
    id 'application'
}

group = 'io.lgoyal.tickvault'
version = '0.1.0'

ext {
    scalaVersion = '2.12.20'
    flinkVersion = '1.20.2'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.scala-lang:scala-library:${scalaVersion}"
    implementation "org.apache.flink:flink-streaming-scala_2.12:${flinkVersion}"
    implementation "org.apache.flink:flink-clients:${flinkVersion}"
    implementation 'org.apache.hadoop:hadoop-common:3.4.1'
    implementation 'org.apache.parquet:parquet-hadoop:1.14.4'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ['-deprecation', '-feature']
}

tasks.withType(Test).configureEach {
    useJUnit()
    maxParallelForks = 1
}

application {
    mainClass = 'io.lgoyal.tickvault.analytics.LiveReplay'
}
