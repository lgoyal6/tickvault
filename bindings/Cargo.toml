[package]
name = "tickvault-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for tickvault: full-depth crypto order book archives"
license = "MIT OR Apache-2.0"

[lib]
# Imported as `tickvault._native`. The Python-facing package in `python/` wraps
# it, so the surface can feel like Python rather than like wrapped Rust.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "59.2.0", default-features = false, features = ["pyarrow"] }
# abi3 so one wheel serves every Python from 3.9 up. Without it maturin emits a
# wheel per interpreter version, and anyone on a version we did not build for
# falls back to compiling Rust at install time, which is not an install.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }
tickvault = { path = ".." }
