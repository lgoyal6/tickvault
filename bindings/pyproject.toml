[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# The distribution name differs from the import name on purpose. `tickvault`
# normalises to `tick-vault` under PEP 503, and that is taken on PyPI by an
# unrelated Dukascopy tick downloader. Renaming the whole project to dodge a
# collision was the alternative; this keeps `import tickvault` intact, which is
# the name that appears in every snippet.
name = "tickvault-ob"
version = "0.1.1"
description = "Full-depth crypto order book archives, honest about their own gaps"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["orderbook", "crypto", "microstructure", "market-data", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/lgoyal6/tickvault"
Documentation = "https://github.com/lgoyal6/tickvault/blob/main/docs/schema.md"
Issues = "https://github.com/lgoyal6/tickvault/issues"

[project.optional-dependencies]
polars = ["polars>=0.20"]
pandas = ["pandas>=2.0"]
plot = ["matplotlib>=3.5"]

[tool.maturin]
python-source = "python"
module-name = "tickvault._native"
features = ["pyo3/extension-module"]
