[package]
name = "tickvault-cli"
version = "0.1.1"
edition = "2024"
description = "The tickvault command line: record, verify, query, and run reproducible experiments over the archive"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lgoyal6/tickvault"
# The binary is what ships; nothing depends on this crate as a library.
publish = false

[[bin]]
name = "tickvault"
path = "src/main.rs"

[dependencies]
# The whole library, capture half included: `record` and `serve` live here.
tickvault = { path = "../.." }
tickvault-features = { path = "../features" }
tickvault-experiment = { path = "../experiment" }
tickvault-report = { path = "../report" }
anyhow = "1.0.104"
arrow = { version = "59.2.0", default-features = false }
clap = { version = "4.6.6", features = ["derive"] }
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap", "zstd"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
arrow = { version = "59.2.0", default-features = false }
tempfile = "3.27.0"
