[package]
name = "tickvault-experiment"
version = "0.1.1"
edition = "2024"
description = "Experiment specification, validation, planning, bounded execution and caching for the tickvault Indicator Lab"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lgoyal6/tickvault"
publish = false

[dependencies]
tickvault = { path = "../..", default-features = false }
tickvault-features = { path = "../features" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "0.9.9"
tempfile = "3.27.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[build-dependencies]
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
