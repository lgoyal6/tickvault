[package]
name = "tickvault-report"
version = "0.1.1"
edition = "2024"
description = "Machine and human readable research reports with exact dataset and code provenance"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lgoyal6/tickvault"
publish = false

[dependencies]
tickvault-experiment = { path = "../experiment" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
