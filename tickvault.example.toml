# A tickvault deployment, described in one file.
#
#   tickvault serve --config tickvault.toml --dry-run   # check it
#   tickvault serve --config tickvault.toml             # run it
#
# One process records every venue below, restarts one that fails, and answers
# for its own health at the address under [status]. Ctrl-C closes the open
# Parquet files before exiting: they are buffered whole in memory, so a process
# that just dies loses everything since the last rotation.

archive = "./archive"

# block: wait for the writer and risk the venue disconnecting us, which the gap
#        report then shows as a reconnect.
# drop:  shed rows and count them, which the gap report shows as rows we lost
#        rather than rows the venue never sent.
# Neither is wrong. Doing one silently is.
backpressure = "block"

# The bound on what a crash costs per partition, not a tuning knob.
rotate_secs = 60

# Batches the ingest-to-writer channel will hold.
queue = 1024

# How long to wait before starting a failed venue again.
restart_secs = 5

[status]
# Loopback on purpose. This says what the recorder is doing and how far behind
# it is, which is not something to put on a public interface by accident.
#
#   GET /         the gap report, live
#   GET /healthz  503 when any venue is down or has gone quiet
#   GET /metrics  Prometheus text
listen = "127.0.0.1:8080"

[[venue]]
name = "coinbase"
symbols = ["BTC-USD", "ETH-USD"]

[[venue]]
name = "kraken"
symbols = ["BTC-USD", "ETH-USD"]
# Ten is the only depth at which Kraken's checksum covers every level the feed
# can touch. Raising it buys depth and loses proof.
kraken_depth = 10

[[venue]]
name = "okx"
symbols = ["BTC-USDT"]

[[venue]]
name = "bybit"
symbols = ["BTC-USDT"]
bybit_depth = 50

[[venue]]
name = "binance-us"
symbols = ["BTC-USDT"]

[[venue]]
name = "bitstamp"
symbols = ["BTC-USD"]
# Worth choosing deliberately. Bitstamp's aggregated feed carries no sequence
# number, no update id and no checksum, so a lost message on it cannot be
# detected by any means and it reports 0% verified. Its order-by-order feed
# chains every event, which makes it the best validated of the six.
book_level = 3
