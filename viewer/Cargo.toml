# Its own workspace on purpose. This is a cdylib for a different architecture,
# and it has no business being built by a plain `cargo test` at the repo root.
[workspace]

[package]
name = "tickvault-viewer"
version = "0.1.0"
edition = "2024"
description = "The tickvault reconstruction engine, compiled to wasm for the book viewer"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features: that is the whole point. The viewer reads an archive and
# never captures one, so it takes none of tokio, TLS or a C compression codec.
tickvault = { path = "..", default-features = false }
wasm-bindgen = "0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# Needed to hand fetched bytes to the Parquet reader, which wants a Bytes.
bytes = "1"
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "snap"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
# The record feature only for tests: they build a real archive to read back.
tickvault = { path = "..", features = ["record"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
